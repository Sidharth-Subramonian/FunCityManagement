# Database Configuration for Fun City 2.0
# Can be overridden by environment variables:
# DB_URL, DB_USER, DB_PASSWORD, DB_DRIVER

# Default MySQL connection settings:
db.url=jdbc:mysql://localhost:3306/funcity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=Changeme@315
db.driver=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
pool.maximumPoolSize=10
pool.minimumIdle=2
pool.idleTimeout=30000
pool.connectionTimeout=10000
pool.maxLifetime=1800000
pool.autoCommit=true

# Test / In-Memory Fallback Flag
# If true and MySQL connection fails, application will offer to fallback to embedded H2 (MySQL Mode)
db.fallback.h2=true

